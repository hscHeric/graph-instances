[tools]
python = "latest"

[env]
_.python.venv = { path = ".venv", create = true }
PROJECT_ROOT = "{{cwd}}"

[tasks."download::harwell_boeing"]
description = "Download the Harwell-Boeing matrix collection"
run = "python scripts/download/download_harwell_boeing.py"

[tasks."download::dimacs"]
description = "Download the DIMACS graph collection"
run = "python scripts/download/download_dimacs.py"

[tasks."download::bhoslib"]
description = "Download the BHOSLIB graph collection"
run = "python scripts/download/download_bhoslib.py"

[tasks."download::snap"]
description = "Download SNAP graph datasets without Friendster"
run = "python scripts/download/download_snap.py"

[tasks."download::snap::full"]
description = "Download all SNAP graph datasets, including Friendster"
run = "python scripts/download/download_snap.py --incluir-friendster"

[tasks."download::all"]
description = "Download all graph datasets"
depends = [
  "download::bhoslib",
  "download::dimacs",
  "download::harwell_boeing",
  "download::snap",
]

[tasks."convert::harwell_boeing"]
description = "Convert Harwell-Boeing matrices to DIMACS .col"
run = "python scripts/convert/matrix_market.py datasets/harwell_boeing/raw"

[tasks."convert::dimacs"]
description = "Convert DIMACS Matrix Market files to DIMACS .col"
run = "python scripts/convert/matrix_market.py datasets/dimacs/raw"

[tasks."convert::bhoslib"]
description = "Convert BHOSLIB Matrix Market files to DIMACS .col"
run = "python scripts/convert/matrix_market.py datasets/bhoslib/raw"

[tasks."convert::snap"]
description = "Convert SNAP edge-list graphs to DIMACS .col"
run = "python scripts/convert/snap.py --input datasets/snap/raw --output datasets/snap/processed"

[tasks."convert::all"]
description = "Convert Matrix Market files from all datasets to DIMACS .col"
run = """
python scripts/convert/matrix_market.py
python scripts/convert/snap.py
"""

[tasks."generate::watts_strogatz"]
description = "Generate Watts-Strogatz graphs in DIMACS .col format"
run = "python scripts/generate/watts_strogatz.py --doubling 200 1.15 30 --k 6 --p-rewire 0.1 --reps 1 --seed 42 --out datasets/watts_strogatz/processed"

[tasks."generate::barabasi_albert"]
description = "Generate Barabasi-Albert graphs in DIMACS .col format"
run = "python scripts/generate/barabasi_albert.py --doubling 200 1.15 30 --m 4 --reps 1 --seed 42 --out datasets/barabasi_albert/processed"

[tasks."generate::erdos_renyi"]
description = "Generate Erdos-Renyi graphs in DIMACS .col format"
run = "python scripts/generate/erdos_renyi.py --doubling 200 1.15 30 --avg-degree 10 --reps 1 --seed 42 --out datasets/erdos_renyi/processed"

[tasks."generate::cubic"]
description = "Generate random cubic graphs in DIMACS .col format"
run = "python scripts/generate/cubic.py --doubling 200 1.15 30 --reps 1 --seed 42 --out datasets/cubicos/processed"

[tasks."generate::all"]
description = "Generate all synthetic graph datasets with standard parameters"
run = """
python scripts/generate/erdos_renyi.py --doubling 200 1.15 30 --avg-degree 10 --reps 1 --seed 42 --out datasets/erdos_renyi/processed
python scripts/generate/barabasi_albert.py --doubling 200 1.15 30 --m 4 --reps 1 --seed 42 --out datasets/barabasi_albert/processed
python scripts/generate/watts_strogatz.py --doubling 200 1.15 30 --k 6 --p-rewire 0.1 --reps 1 --seed 42 --out datasets/watts_strogatz/processed
python scripts/generate/cubic.py --doubling 200 1.15 30 --reps 1 --seed 42 --out datasets/cubicos/processed
"""

[tasks."select::harwell_boeing"]
description = "Select representative Harwell-Boeing graphs"
run = "python scripts/select/representative_selection.py --input-dir datasets/harwell_boeing/processed --out datasets/harwell_boeing/selected --db-name harwell_boeing --n 50"

[tasks."select::dimacs"]
description = "Select representative DIMACS graphs"
run = "python scripts/select/representative_selection.py --input-dir datasets/dimacs/processed --out datasets/dimacs/selected --db-name dimacs --n 80 --usar-todos-se-faltar"

[tasks."select::bhoslib"]
description = "Select representative BHOSLIB graphs"
run = "python scripts/select/representative_selection.py --input-dir datasets/bhoslib/processed --out datasets/bhoslib/selected --db-name bhoslib --n 30"

[tasks."select::snap"]
description = "Select representative SNAP graphs"
run = "python scripts/select/representative_selection.py --input-dir datasets/snap/processed --out datasets/snap/selected --db-name snap --n 20 --ignorar-sem-arestas --usar-todos-se-faltar"

[tasks."select::erdos_renyi"]
description = "Select representative Erdos-Renyi graphs"
run = "python scripts/select/representative_selection.py --input-dir datasets/erdos_renyi/processed --out datasets/erdos_renyi/selected --db-name erdos_renyi --n 30 --usar-todos-se-faltar"

[tasks."select::barabasi_albert"]
description = "Select representative Barabasi-Albert graphs"
run = "python scripts/select/representative_selection.py --input-dir datasets/barabasi_albert/processed --out datasets/barabasi_albert/selected --db-name barabasi_albert --n 30 --usar-todos-se-faltar"

[tasks."select::watts_strogatz"]
description = "Select representative Watts-Strogatz graphs"
run = "python scripts/select/representative_selection.py --input-dir datasets/watts_strogatz/processed --out datasets/watts_strogatz/selected --db-name watts_strogatz --n 30 --usar-todos-se-faltar"

[tasks."select::cubic"]
description = "Select representative cubic graphs"
run = "python scripts/select/representative_selection.py --input-dir datasets/cubicos/processed --out datasets/cubicos/selected --db-name cubicos --n 30 --usar-todos-se-faltar"

[tasks."select::all"]
description = "Select representative graphs from every dataset"
run = """
python scripts/select/representative_selection.py --input-dir datasets/harwell_boeing/processed --out datasets/harwell_boeing/selected --db-name harwell_boeing --n 50
python scripts/select/representative_selection.py --input-dir datasets/bhoslib/processed --out datasets/bhoslib/selected --db-name bhoslib --n 30
python scripts/select/representative_selection.py --input-dir datasets/dimacs/processed --out datasets/dimacs/selected --db-name dimacs --n 80 --usar-todos-se-faltar
python scripts/select/representative_selection.py --input-dir datasets/snap/processed --out datasets/snap/selected --db-name snap --n 20 --ignorar-sem-arestas --usar-todos-se-faltar
python scripts/select/representative_selection.py --input-dir datasets/erdos_renyi/processed --out datasets/erdos_renyi/selected --db-name erdos_renyi --n 30 --usar-todos-se-faltar
python scripts/select/representative_selection.py --input-dir datasets/barabasi_albert/processed --out datasets/barabasi_albert/selected --db-name barabasi_albert --n 30 --usar-todos-se-faltar
python scripts/select/representative_selection.py --input-dir datasets/watts_strogatz/processed --out datasets/watts_strogatz/selected --db-name watts_strogatz --n 30 --usar-todos-se-faltar
python scripts/select/representative_selection.py --input-dir datasets/cubicos/processed --out datasets/cubicos/selected --db-name cubicos --n 30 --usar-todos-se-faltar
"""
